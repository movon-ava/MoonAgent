[project]
name = "ctf-agent-two"
version = "0.1.0"
description = "CTF agent v2 — multi-model solver swarm"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai[bedrock,openai,google]>=1.107.9,<2",
    "pydantic-settings",
    "genai-prices",
    "boto3",
    "aiodocker",
    "claude-agent-sdk",
    "httpx",
    "pyyaml",
    "rich",
    "click",
    "markdownify",
    "pillow",
]

[project.scripts]
ctf-solve = "backend.cli:main"
ctf-msg = "backend.cli:msg"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "coverage>=7.6",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.14",
    "ty>=0.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "PTH", "S110"]
ignore = ["E501", "SIM105", "SIM115", "PTH123"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: needs Docker, the network, or a real model call",
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.per-file-ignores]
# the self-check scripts bootstrap sys.path before importing backend
"scripts/test_*.py" = ["E402"]
"scripts/cleanup_logs.py" = ["E402"]
"scripts/inspect_pai.py" = ["E402"]
"tests/*" = ["E402"]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ty.environment]
python-version = "3.14"
